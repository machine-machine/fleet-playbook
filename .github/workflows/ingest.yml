name: Ingest Playbook into Fleet Memory

on:
  push:
    branches: [main]
    paths:
      - 'PLAYBOOK.md'
      - 'sections/**'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify fleet — trigger re-ingest via Mattermost
        run: |
          curl -s -X POST "https://chat.machinemachine.ai/api/v4/posts" \
            -H "Authorization: Bearer ${{ secrets.MATTERMOST_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "channel_id": "${{ secrets.FLEET_OPS_CHANNEL_ID }}",
              "message": "@m2 Playbook updated on main. Please re-ingest PLAYBOOK.md into memory.machinemachine.ai (Qdrant fleet namespace). Run: python3 ~/.hermes/skills/m2-memory/scripts/ingest_sessions.py -v --source ~/.hermes/workspace/projects/fleet-playbook/PLAYBOOK.md  (commit ${{ github.sha }})"
            }'
          echo "Re-ingest request posted to Mattermost fleet-ops for m2"
